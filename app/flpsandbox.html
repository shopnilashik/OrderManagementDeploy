<!DOCTYPE html>
<html>

<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>{{appTitle}}</title>
	<script type="text/javascript">
		window["sap-ushell-config"] = {
			defaultRenderer: "fiori2",
			bootstrapPlugins: {
				RuntimeAuthoringPlugin: {
					component: "sap.ushell.plugins.rta",
					config: {
						validateAppVersion: false,
					},
				},
			},
			renderers: {
				fiori2: {
					componentData: {
						config: {
							search: "hidden",
						},
					},
				},
			},
			applications: {
				"CreateSalesmanProfile-display": {
					title: "Project 1",
					description: "",
					additionalInformation: "SAPUI5.Component=project1",
					applicationType: "URL",
					url: "./project1/webapp",
					navigationMode: "embedded",
				},
			},
		};
	</script>

	<script src="https://ui5.sap.com/test-resources/sap/ushell/bootstrap/sandbox.js"></script>
	<script src="https://ui5.sap.com/resources/sap-ui-core.js" data-sap-ui-libs="sap.m, sap.ushell, sap.fe.templates"
		data-sap-ui-compatVersion="edge" data-sap-ui-theme="sap_horizon" data-sap-ui-frameOptions="allow"
		data-sap-ui-bindingSyntax="complex"></script>
	<script>
		sap.ui.getCore().attachInit(function () {
			sap.ushell.Container.createRenderer().placeAt("content");
		});
	</script>
</head>
<!-- UI Content -->

<body class="sapUiBody" id="content"></body>

</html>
